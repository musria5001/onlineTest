{% extends 'base.html' %} 

{% block title %} 
签到信息详情
{% endblock %} 

{% block extrahead %} 

{% load static %}
<script src="{% static 'assets/js/bootstrap-table.min.js' %}"></script>
<link href="{% static 'assets/css/bootstrap-table.min.css' %}" rel="stylesheet">
<script src="{% static 'assets/js/bootstrap-table-zh-CN.min.js' %}"></script>
<script src="{% static 'assets/js/bootstrap-table-export.min.js' %}"></script>
<script src="{% static 'assets/js/tableExport.js' %}"></script>
<script type="text/javascript" src="https://api.map.baidu.com/api?v=2.0&ak=NW1qGiEHfWeZLoVMg6ZtxeC9dyswLbGR"></script> 
{% endblock %} 


{% block content %}
<ol class="breadcrumb">
    <li>
        <a href="{% url 'index' %}">主页</a>
    </li >
    <li class="active"><a href="{% url 'sign.teacher.index' %}">签到管理</a></li>
    <li class="active">查看详情</li>
</ol>

<h3>签到信息详情</h3>

<!-- Modal 弹出模态框 -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 id="myModalLabel" class="modal-title">假条</h4>
            </div>
            <div class="modal-body">
                <h4 id="leave-cause"></h4>
                <div class="col-sm-12" style="float:none;"> 
                    <img id="img-src" width="60%" class="img-responsive">
                </div>
            </div>
            <div class="modal-footer">

                <div class="pull-left">
                    <button id="accept-btn" type="button" class="btn btn-success btn-sm">通过</button>
                    <button id="decline-btn" type="button" class="btn btn-danger btn-sm">拒绝</button>
                </div>

                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modal1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 id="myModalLabel" class="modal-title">假条</h4>
            </div>
            <div class="modal-body">
                <h4 id="leave-cause1"></h4>
                <div class="col-sm-12" style="float:none;">
                    <img id="img-src1" width="60%" class="img-responsive">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<h3>
    <form class="form-inline" method="post" action="{% url 'sign.supplement' eventId %}">
        <div class="form-group">
            <input id="studentId" type="text" class="form-control" name="studentId" placeholder="学号">
        </div>
        <button id="supplement" class="btn btn-primary">补签</button>
    </form>
</h3>
    <div id="modal_result" class="fade modal" role="dialog" tabindex="-1" data-backdrop="static">
        <div class="modal-dialog ">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title">详细签到位置</h4>
                </div>
                <div id="page" class="modal-body">
                    <p style="float:block;width:100%;margin:auto;height:300px;font-size:18px;" id="allmap" hidden></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
    <div id="toolbar">
        <div class="form-inline" role="form">
            <div class="form-group">
                <select class="form-control" id="usergroup" name="usergroup">
                    <option value="0" selected="selected">所有状态</option>
                    <option value="1">正常签到</option>
                    <option value="2">未签到</option>
                    <option value="3">假条已审核</option>
                    <option value="4">假条待审核</option>
                </select>
            </div>
            <button id="ok" type="submit" class="btn btn-default">筛选</button>
        </div>
    </div>
    <table id="table-sign"
           data-toggle="table"
           data-url="{% url 'sign.get_sign_list' eventId %}"
           data-side-pagination="server"
           data-pagination="true"
           data-page-size="20"
           data-page-list="[10, 20, 50, 100, 200]"
           data-classes="table table-hover table-condensed"
           data-toolbar="#toolbar"
           data-query-params="queryParams"
           data-striped="true"
           data-search="true"
           data-sort-name="id_num"
           data-sort-order="asc"
           data-show-export="true"
    >
        <thead>
        <tr>
            <th data-field="id" data-visible="false"></th>
            <th data-field="path" data-visible="false"></th>
            <th data-field="id_num" data-sortable="true">学生学号</th>
            <th data-field="username">学生姓名</th>
            <th data-field="created_time" data-sortable="true">签到时间</th>
            <th class="nobr" data-field="studentposition" data-formatter="showlocation">签到位置</th>
            <th data-field="distance" data-formatter="editdistance" data-sortable="true">签到距离(米)</th>
            <th data-field="status" data-sortable="true" data-formatter="editstatus">备注</th>
        </tr>
        </thead>
    </table>
    <script>
        $('#toolbar').find('select[name]').each(function () {
            $(this).val('{{ usergroup }}');
        });
        $.ajaxSetup({
            data: {csrfmiddlewaretoken: '{{ csrf_token }}'}
        });
        var $table = $('#table-sign');
        function queryParams(params) {
            $('#toolbar').find('select[name]').each(function () {
                params[$(this).attr('name')] = $(this).val();
            });
            return params;
        }
        $ok = $('#ok');
        $(function () {
            $ok.click(function () {
                $table.bootstrapTable('refresh');
            });
        });
    </script>

<script>
    let sId,a,A1,A2;
    const showDetail = function (id) {
        sId = id
        $('#img-src').attr('src', '/static/' + $('#'+id).attr('img-src'))
        $('#leave-cause').text(($('#'+id).attr('cause')))
    }
    const showDetail1 = function (id) {
        sId = id
        $('#img-src1').attr('src', '/static/' + $('#'+id).attr('img-src'))
        $('#leave-cause1').text(($('#'+id).attr('cause')))
    }
    function showposition(studentposition){
        $('#modal_result').modal('show');
        console.log(studentposition);
        [A1,A2] = studentposition.split(",");
        var map = new BMap.Map("allmap");
        map.addControl(new BMap.NavigationControl());
        var point = new BMap.Point(eval(A1),eval(A2));
        $('#allmap').show(map.centerAndZoom(point,16));
        var marker = new BMap.Marker(point);
        map.addOverlay(marker);
        
        map.addEventListener("tilesloaded",function(){
            map.setCenter(point);
        });
    }

    function hideposition(){
        $("#allmap").hide();
    }
    $('#supplement').on('click', function(e){
        e.preventDefault(); //取消默认行为
        id = $('#studentId').val();
        supplement(id);
    })
    function supplement(id){
        //e.preventDefault() //取消默认行为
        let urlArr = window.location.pathname.split('/')
        $.post('/sign/supplement/' + urlArr[urlArr.length - 1], {
                studentId: id //$('#studentId').val()
            }, function (result, statue) {
                console.log(1);
                if (statue === 'success') {
                    if (result.success) {
                        location.reload()
                    } else {
                        alert(result.errMsg)
                    }
                } else {
                    alert('服务器抽风了QAQ，程序员小哥哥维修中')
                }
            })
    }

    $('#accept-btn').on('click', function (e){
        $.post('/sign/accept/' + sId, {}, function(result, statue) {
            if (statue === 'success') {
                if (result.success) {
                    $('#modal').modal('hide');
                    $table.bootstrapTable('refresh');
                    // location.reload()
                } else {
                    alert(result.errMsg)
                }
            } else {
                alert('服务器抽风了QAQ，程序员小哥哥维修中')
            }
        })
    })

    $('#decline-btn').on('click', function (e){
        $.post('/sign/decline/' + sId, {}, function(result, statue) {
            if (statue === 'success') {
                if (result.success) {
                    $('#modal').modal('hide');
                    $table.bootstrapTable('refresh');
                    // location.reload()
                } else {
                    alert(result.errMsg)
                }
            } else {
                alert('服务器抽风了QAQ，程序员小哥哥维修中')
            }
        })
    })

    function showlocation(value, row, index) {
        if(value != '未知' && value && value != 'null')
            return '<button type="button" style="float:left" onclick="showposition( \'' + value + '\' )">显示详细位置</button>';
        else if(value != 'null' && value)
            return value;
    }
    function editstatus(value, row, index){
        if(value == "假条待审核")
            return value + '  <a id="' + row.id + '" img-src="'+ row.path + '" cause="' + row.cause + '" data-toggle="modal" data-target="#modal" onclick="showDetail(' + row.id + ')" href="#">查看</a>';
        else if(value == "假条已审核")
            return value + '  <a id="' + row.id + '" img-src="'+ row.path + '" cause="' + row.cause + '" data-toggle="modal" data-target="#modal1" onclick="showDetail1(' + row.id + ')" href="#">查看</a>';
        else if(value == "未签到"){
            return value + ' <a href="javascript:supplement(\'' + row.id_num + '\')' + '">补签</a>';}
        else
            return value;
    }
    function editdistance(value, row, index){
        if(value!='未知' && value)
            return Math.round(value);
        else
            return value;
    }
</script>

{% endblock %}
