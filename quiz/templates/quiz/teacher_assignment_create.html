{% extends 'base.html' %}
{% block content %}
<style>
    .kp2-grid { margin-top: 15px; }
    .kp2-card { padding: 12px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 8px; cursor: pointer; }
    .kp2-card:hover { border-color: #337ab7; background: #f0f7ff; }
    .kp2-card.selected { border-color: #337ab7; background: #d9edf7; }
    .kp2-card .badge { float: right; }
</style>

<form id="assignment-form">
    <div class="form-group">
        <label>选择班级</label>
        <select class="form-control" id="banji-select" required>
            <option value="">-- 选择班级 --</option>
            {% for bj in banjis %}
            <option value="{{ bj.id }}">{{ bj.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>选择知识点（点击选中）</label>
        <div class="kp2-grid">
            {% for kp2 in kp2_data %}
            <div class="kp2-card" data-kp2="{{ kp2.id }}" data-choice="{{ kp2.choice_total }}" data-ducheng="{{ kp2.ducheng_total }}" onclick="selectKP2(this)">
                <strong>{{ kp2.name }}</strong>
                <span class="badge">选{{ kp2.choice_total }}题 / 填{{ kp2.ducheng_total }}题</span>
                <br><small class="text-muted">{{ kp2.course_name }} / {{ kp2.kp1_name }}</small>
            </div>
            {% endfor %}
        </div>
        {% if not kp2_data %}
        <div class="alert alert-warning">暂无可用知识点，请先在题库中添加选择题并关联知识点。</div>
        {% endif %}
    </div>

    <div class="form-group">
        <label>作业标题</label>
        <input type="text" class="form-control" id="title-input" placeholder="选填，默认自动生成">
    </div>

    <div class="row">
        <div class="col-md-3">
            <div class="form-group">
                <label>选择题数量</label>
                <input type="number" class="form-control" id="choice-count" value="3" min="0">
            </div>
        </div>
        <div class="col-md-3">
            <div class="form-group">
                <label>填空题数量</label>
                <input type="number" class="form-control" id="ducheng-count" value="2" min="0">
            </div>
        </div>
        <div class="col-md-3">
            <div class="form-group">
                <label>截止时间（选填）</label>
                <input type="datetime-local" class="form-control" id="deadline-input">
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-primary btn-lg" onclick="submitForm()">
        <i class="fa fa-check"></i> 布置作业
    </button>
    <a href="{% url 'quiz_teacher_assignment_list' %}" class="btn btn-default btn-lg">查看已布置</a>
</form>

<script>
var selectedKp2 = null;

function selectKP2(el) {
    $('.kp2-card').removeClass('selected');
    $(el).addClass('selected');
    selectedKp2 = $(el).data('kp2');
    $('#choice-count').attr('max', $(el).data('choice'));
    $('#ducheng-count').attr('max', $(el).data('ducheng'));
}

function submitForm() {
    var banjiId = $('#banji-select').val();
    if (!banjiId) { alert('请选择班级'); return; }
    if (!selectedKp2) { alert('请点击选择一个知识点'); return; }

    $.ajax({
        type: 'POST',
        url: '{% url "quiz_teacher_assignment_create" %}',
        data: {
            banji_id: banjiId,
            kp2_id: selectedKp2,
            title: $('#title-input').val(),
            choice_count: $('#choice-count').val(),
            ducheng_count: $('#ducheng-count').val(),
            deadline: $('#deadline-input').val(),
        },
        dataType: 'json',
        success: function(res) {
            if (res.ok) {
                alert('布置成功！');
                location.href = '{% url "quiz_teacher_assignment_list" %}';
            }
        },
        error: function() { alert('操作失败'); }
    });
}
</script>
{% endblock %}
